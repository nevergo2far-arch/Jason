name: Full-market 3-month pull (price + chip data, real network)

# One-off large pull: every TWSE+TPEx ticker's price, institutional
# buy/sell, and margin trading for the last ~3 months, plus a
# whole-market snapshot from TWSE/TPEx OpenAPI, for technical +
# chip-flow (籌碼面) analysis. This is a multi-thousand-ticker job that
# can run for hours, unlike scraper-smoke-test.yml's small fixed
# sample -- kept as its own workflow so it doesn't fire on every
# routine scraper/** push.
#
# First run (no FINMIND_TOKEN) hit FinMind's anonymous free-tier
# quota hard: only 972 of 9447 (ticker, dataset) jobs succeeded before
# every subsequent request failed for the rest of the run. Those 8475
# failures landed in the checkpoint as `error`, not falsely `done`
# (the FinMindApiError fix), so they're safe to retry -- but doing
# that needs FINMIND_TOKEN set (raises the quota to the account's
# documented 600 req/hour) AND the checkpoint database carried over
# from the previous run (see the restore step below), or every rerun
# just re-attempts the same 9447 jobs from zero instead of targeting
# the 8475 that actually failed.
#
# Uses secrets.FINMIND_TOKEN if the repo has it configured (Settings
# -> Secrets and variables -> Actions -> New repository secret). Runs
# fine without it too, just back at the low anonymous quota.
#
# Triggered the same way scraper-smoke-test.yml originally was:
# workflow_dispatch needs this file merged to the default branch
# first, so pull_request (scoped to this file) is what actually fires
# pre-merge.
on:
  pull_request:
    paths:
      - ".github/workflows/full-market-3month-pull.yml"
  workflow_dispatch:

jobs:
  full-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      # 600/hour per the account's documented limit -> 10/min. The
      # first run used the old default (50/min, meant for the
      # anonymous tier) and blew through the real budget in under two
      # minutes, then failed for the remaining ~5+ hours -- this
      # paces requests to actually match the quota instead of bursting
      # into it.
      FINMIND_RPM: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Find previous run of this workflow (for resume)
        id: prev_run
        # --status success (as opposed to `completed`, which covers
        # every finished conclusion) missed exactly the case that
        # matters most: a run that hit the 330-minute job timeout and
        # got marked `cancelled` still uploads its DB via the
        # `if: always()` on the upload step, and often has *more*
        # progress than the last clean `success` run before it. Using
        # `success` here meant a resume after a timeout would discard
        # that run's progress and restore from the older, less-complete
        # DB instead -- caught by inspection before it actually
        # happened to run 5's restore step, but only just.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow "full-market-3month-pull.yml" --status completed \
            --json databaseId --jq '.[0].databaseId' || true)
          echo "Previous run id: ${RUN_ID:-none}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Restore previous run's database (resume support)
        if: steps.prev_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: full-market-3month-db
          path: scraper/data/
          run-id: ${{ steps.prev_run.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true # first-ever run (or artifact expired): fine, just starts fresh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: FinMind - fetch full TWSE+TPEx ticker universe
        working-directory: scraper
        run: python run_batch_download.py stock-list

      - name: FinMind - queue price + chip datasets for every ticker
        working-directory: scraper
        # Already-queued (ticker, dataset) pairs from a restored DB
        # are left untouched by init_checkpoint_jobs -- this only adds
        # rows for anything genuinely new (e.g. a newly listed ticker).
        run: >
          python run_batch_download.py queue --source finmind
          --datasets price institutional_investors margin_trading

      - name: FinMind - run (targets only what's still pending/errored)
        working-directory: scraper
        run: python run_batch_download.py run --source finmind --start-date 2026-06-21

      - name: TWSE/TPEx - market-wide snapshot (real API)
        working-directory: scraper
        run: python run_batch_download.py market-wide

      - name: Export
        working-directory: scraper
        run: |
          python run_batch_download.py export
          echo "----- checkpoint summary -----"
          python -c "
          import sys; sys.path.insert(0, '.')
          from config import CONFIG
          from core.storage import Storage
          with Storage(CONFIG.db_path) as s:
              print(s.checkpoint_summary())
          "

      - name: Upload exported data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-market-3month-output
          path: scraper/data/exports/
          if-no-files-found: warn

      - name: Upload SQLite DB as artifact (source of truth, for resuming)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-market-3month-db
          path: scraper/data/tw_stock_data.db
          if-no-files-found: warn
