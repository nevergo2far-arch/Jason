name: Scraper smoke test (real network)

# Hits real external APIs (FinMind, TWSE/TPEx open data). GitHub-hosted
# runners have normal internet egress, unlike the sandbox this code was
# originally written in, which is the whole point of running it here:
# it's the first real check of whether the dataset names / endpoint
# paths in sources/finmind_client.py and sources/twse_openapi_client.py
# are actually correct.
#
# workflow_dispatch alone would need this file merged to the default
# branch first (GitHub only allows manually dispatching workflows that
# already exist there), so pull_request is the trigger that actually
# works pre-merge — scoped to changes under scraper/ or this file so it
# doesn't run on unrelated pushes. workflow_dispatch stays too, for
# manual reruns once this is on the default branch.
#
# Deliberately does NOT touch Goodinfo — that client stays opt-in and
# untouched by CI; enabling it is a human decision, not something a
# workflow should do on its own.
on:
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-smoke-test.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: Report whether a FinMind token is configured (never the value itself)
        run: |
          if [ -n "$FINMIND_TOKEN" ]; then
            echo "FINMIND_TOKEN is set (length: ${#FINMIND_TOKEN} chars) -- requests below use it."
          else
            echo "FINMIND_TOKEN is NOT set -- requests below use the anonymous tier."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: FinMind - fetch stock list (real API)
        working-directory: scraper
        run: python run_batch_download.py stock-list

      - name: FinMind - queue a small batch (known real companies, 2 datasets)
        working-directory: scraper
        # NOT --limit 3: the stocks table is ordered alphabetically by
        # ticker, so the first few are ETFs (tickers starting "00...")
        # which have no financial-statement/revenue data in FinMind —
        # a first attempt at this smoke test picked those and got 0
        # records back with no errors, which looked like a bug but
        # wasn't. Use real listed companies instead.
        run: |
          printf '2330\n2454\n2317\n' > /tmp/smoke_test_tickers.txt
          python run_batch_download.py queue --source finmind \
            --datasets cash_flow_statement monthly_revenue \
            --tickers-file /tmp/smoke_test_tickers.txt

      - name: FinMind - queue new datasets under verification (foreign_holding, shareholding_distribution, securities_lending, valuation_ratios)
        working-directory: scraper
        # These dataset names/methods were just added to
        # finmind_client.py and have never been hit against the real
        # API. Queued and run separately from the batch above so this
        # step's own log output (and the per-dataset export files
        # below) show plainly which of them actually exist and
        # return data, rather than mixing pass/fail in with datasets
        # already known-good.
        run: |
          python run_batch_download.py queue --source finmind \
            --datasets foreign_holding shareholding_distribution securities_lending valuation_ratios \
            --tickers-file /tmp/smoke_test_tickers.txt

      - name: FinMind - run the queued batch (real API)
        working-directory: scraper
        run: python run_batch_download.py run --source finmind

      - name: TWSE/TPEx - market-wide daily data (real API, all listed tickers)
        working-directory: scraper
        run: python run_batch_download.py market-wide

      - name: Export and print results
        working-directory: scraper
        run: |
          python run_batch_download.py export
          echo "----- index.json (2330 entry only) -----"
          python -c "
          import json
          idx = json.load(open('data/exports/index.json'))
          print(json.dumps(idx['tickers'].get('2330'), ensure_ascii=False, indent=2))
          "
          echo
          echo "----- 2330's cash_flow_statement.json (first 40 lines) -----"
          head -n 40 data/exports/2330/cash_flow_statement.json || echo "(no cash flow records for 2330 - real problem, dataset name may be wrong)"
          echo
          echo "----- 2330's twse_stock_day_all.json (whole-market daily price) -----"
          cat data/exports/2330/twse_stock_day_all.json || echo "(no market-wide record for 2330)"
          echo
          echo "----- new dataset verification for 2330: foreign_holding -----"
          cat data/exports/2330/foreign_holding.json || echo "(NOT FOUND -- dataset name is wrong or exports/2330 has no such file)"
          echo
          echo "----- new dataset verification for 2330: shareholding_distribution -----"
          head -c 2000 data/exports/2330/shareholding_distribution.json || echo "(NOT FOUND -- dataset name is wrong or exports/2330 has no such file)"
          echo
          echo "----- new dataset verification for 2330: securities_lending -----"
          cat data/exports/2330/securities_lending.json || echo "(NOT FOUND -- dataset name is wrong or exports/2330 has no such file)"
          echo
          echo "----- new dataset verification for 2330: valuation_ratios -----"
          cat data/exports/2330/valuation_ratios.json || echo "(NOT FOUND -- dataset name is wrong or exports/2330 has no such file)"

      - name: MOPS - robots.txt check only (no data request)
        working-directory: scraper
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from config import CONFIG
          from sources.mops_client import QUERY_PATH, MopsClient

          client = MopsClient(CONFIG.mops)
          allowed = client.robots.can_fetch(QUERY_PATH)
          print(f"robots.txt allows {QUERY_PATH}: {allowed}")
          PY

      - name: Upload exported data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-smoke-test-output
          path: scraper/data/exports/
          if-no-files-found: warn
